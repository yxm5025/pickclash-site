<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PickClash</title>
<meta name="description" content="Free-to-play sports picks. Make picks with friends, loser takes the forfeit. Find out how good you are, then prove it.">
<link rel="canonical" href="https://pickclash.co/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="PickClash">
<meta property="og:title" content="PickClash">

<meta property="og:url" content="https://pickclash.co/">
<style>
  :root { --page:#0E0E13; --green:#32D74B; --on-green:#06130A; --purple:#BF5AF2; --grey:#98989F; --light:#C8C8CF; --text:#F2F2F7; --dim:#6E6E78; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--page); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif; -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%; }
  main { max-width:420px; margin:0 auto; padding:36px 20px 40px; display:flex; flex-direction:column; gap:18px; }
  .wordmark { font-size:30px; font-weight:800; letter-spacing:-0.5px; }
  .tagline { font-size:16px; color:var(--light); line-height:1.4; margin-top:2px; }
  hr { border:0; height:1px; background:rgba(255,255,255,0.08); margin:0; width:100%; }
  /* one strip per mode: a hairline in the mode's colour, its name, its line */
  .mode { border-left:2px solid var(--c); padding:2px 0 2px 12px; display:flex; flex-direction:column; gap:4px; }
  .mode .name { font-size:11px; font-weight:700; letter-spacing:1.2px; color:var(--c); }
  .mode .line { font-size:17px; font-weight:600; line-height:1.3; }
  .btn { display:block; text-align:center; text-decoration:none; font-size:15px; font-weight:700; padding:14px; border-radius:12px; background:var(--green); color:var(--on-green); margin-top:6px; }
  footer { margin-top:10px; font-size:12px; color:var(--dim); text-align:center; line-height:1.9; }
  footer a { color:var(--grey); text-decoration:underline; }
</style>
</head>
<body>
<main>
  <div>
    <div class="wordmark">PickClash</div>
    <div class="tagline">Free-to-play sports picks.</div>
  </div>
  <hr>
  <div class="mode" style="--c:var(--green)">
    <div class="name">PRIVATE PODS</div>
    <div class="line">Make picks with friends.<br>Loser takes the forfeit.</div>
  </div>
  <div class="mode" style="--c:var(--purple)">
    <div class="name">MY STATS</div>
    <div class="line">Find out how good you are.<br>Then prove it.</div>
  </div>
  <a class="btn" href="https://apps.apple.com/us/app/pickclash/id6792824309">Get PickClash</a>
  <footer>
    Free to play · Virtual coins and tokens · No real money<br>
    <a href="https://meanfieldllc.com/pickclash/privacy">Privacy Policy</a> · <a href="https://meanfieldllc.com/pickclash/terms">Terms and Conditions</a> · <a href="mailto:info@meanfieldllc.com">Contact</a>
  </footer>
</main>
</body>
</html>
