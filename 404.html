<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PickClash · Pod invite</title>
<meta name="description" content="You've been invited to a PickClash pod. Make picks with friends. Loser takes the forfeit.">
<style>
  :root { --page:#0E0E13; --card:#1C1C26; --green:#32D74B; --on-green:#06130A; --yellow:#FFD60A; --gold:#E8D898; --grey:#98989F; --light:#C8C8CF; --text:#F2F2F7; --dim:#6E6E78; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--page); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  main { max-width:420px; margin:0 auto; padding:36px 20px 40px; display:flex; flex-direction:column; gap:14px; }
  .wordmark { font-size:30px; font-weight:800; letter-spacing:-0.5px; }
  .tagline { font-size:16px; color:var(--light); line-height:1.4; }
  hr { border:0; height:1px; background:rgba(255,255,255,0.08); margin:8px 0 2px; }
  .invite { font-size:20px; font-weight:800; line-height:1.3; }
  .meta { font-size:13px; color:var(--grey); }
  /* the pod card's forfeit strip (11/4): gold hairline, gold eyebrow, the rule in ink */
  .strip { border-left:2px solid var(--gold); padding:2px 0 2px 12px; display:flex; flex-direction:column; gap:4px; }
  .strip .eyebrow { font-size:11px; font-weight:700; letter-spacing:1.2px; color:var(--gold); }
  .strip .eyebrow .tag { color:var(--dim); }
  .strip .rule { font-size:17px; font-weight:600; color:var(--text); line-height:1.3; }
  .btn { display:block; text-align:center; text-decoration:none; font-size:15px; font-weight:700; padding:14px; border-radius:12px; cursor:pointer; border:0; width:100%; }
  .btn-primary { background:var(--green); color:var(--on-green); }
  .btn-light { background:var(--text); color:var(--page); }
  .cap { font-size:12px; color:var(--grey); text-align:center; margin-top:-8px; }
  .hint { font-size:13px; color:var(--grey); line-height:1.5; text-align:center; }
  .hint b { color:var(--text); font-family:ui-monospace,Menlo,monospace; letter-spacing:1px; }
  .toast { font-size:12px; color:var(--green); text-align:center; min-height:16px; }
  footer { margin-top:18px; font-size:12px; text-align:center; line-height:1.6; }
  footer a { color:var(--green); text-decoration:underline; }
  footer .dot { color:var(--dim); }
</style>
</head>
<body>
<style>main[hidden]{display:none !important}</style>
<main id="notfound" hidden style="text-align:center"><h1 style="font-size:22px;margin:40px 0 8px">Page not found</h1><p><a href="/" style="color:#32D74B;font-weight:700">PickClash home</a></p></main>
<main>
  <div>
    <div class="wordmark">PickClash</div>
    <div class="tagline">Make picks with friends. Loser takes the forfeit.</div>
  </div>
  <hr>
  <div>
    <div class="invite" id="invite">You’re invited to a pod</div>
    <div class="meta" id="meta">&nbsp;</div>
  </div>
  <div class="strip" id="strip" hidden>
    <div class="eyebrow">THIS WEEK'S FORFEIT<span class="tag" id="tag"></span></div>
    <div class="rule" id="rule"></div>
  </div>
  <button class="btn btn-primary" id="get">Get PickClash</button>
  <div class="cap">Don’t have it yet</div>
  <a class="btn btn-light" id="open" href="#">Open PickClash</a>
  <div class="cap">Already installed</div>
  <div class="toast" id="toast"></div>
  <div class="hint" id="hint">In the app, follow the prompt or enter invite code <b id="code"></b>.</div>
  <footer><a href="https://meanfieldllc.com/pickclash/privacy">Privacy Policy</a> <span class="dot">·</span> <a href="https://meanfieldllc.com/pickclash/terms">Terms and Conditions</a></footer>
</main>
<script>
(function () {
  // ---- config: swap STORE_URL for the App Store link at launch (TestFlight public link while testing)
  // App Store listing. While a build is only on TestFlight, swap in the external group's public link
  // (App Store Connect → TestFlight → the group → Enable Public Link).
  var STORE_URL = "https://testflight.apple.com/join/PxGMT4NX";   // TestFlight while v2 is in testing; App Store: https://apps.apple.com/us/app/pickclash/id6792824309
  var API = "https://zmmoo683b7.execute-api.us-east-1.amazonaws.com/Prod";

  var parts = location.pathname.replace(/\/+$/, "").split("/");
  if (parts.length < 2 || parts[parts.length - 2] !== "join") {
    document.getElementById("notfound").hidden = false;
    var mains = document.getElementsByTagName("main"); mains[1].hidden = true; return;
  }
  var code = (parts[parts.length - 1] || "").toUpperCase();
  if (!/^[A-Z0-9]{6}$/.test(code)) code = (new URLSearchParams(location.search).get("code") || "").toUpperCase();
  var by = new URLSearchParams(location.search).get("by") || "";
  var fullLink = "https://pickclash.co/join/" + code + (by ? "?by=" + encodeURIComponent(by) : "");

  document.getElementById("code").textContent = code || "——————";
  document.getElementById("open").href = "pickclash://join/" + code + (by ? "?by=" + encodeURIComponent(by) : "");

  function leagueName(k) { return ({NFL:"Pro Football", NCAAF:"College Football", MLB:"Pro Baseball", NBA:"Pro Basketball", NCAAB:"College Basketball"})[k] || k || ""; }
  function members(n) { return n === 1 ? "1 member" : n + " members"; }

  if (code) {
    fetch(API + "/pod-preview?code=" + encodeURIComponent(code) + (by ? "&by=" + encodeURIComponent(by) : ""))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (p) {
        if (!p) return;
        document.getElementById("invite").textContent = (p.invited_by ? p.invited_by + " invited you to " : "You’re invited to ") + p.pod_name;
        var meta = [members(p.member_count)]; if (p.league) meta.push(leagueName(p.league));
        document.getElementById("meta").textContent = meta.join(" · ");
        document.getElementById("hint").innerHTML = "In the app, follow the prompt to join <b style=\"font-family:inherit;letter-spacing:0\">" + p.pod_name.replace(/</g, "&lt;") + "</b>, or enter invite code <b>" + code + "</b>.";
        if (p.rule) {
          document.getElementById("rule").textContent = p.rule;
          var end = p.window_end ? new Date(p.window_end) : null;
          if (end && !isNaN(end)) document.getElementById("tag").textContent = " · SETTLES " + end.toLocaleDateString("en-US", {month: "short", day: "numeric"}).toUpperCase();
          document.getElementById("strip").hidden = false;
        }
      }).catch(function () {});
  }

  // Get PickClash: copy the FULL link (the app detects the pattern on first launch, no prompt), then the store.
  document.getElementById("get").addEventListener("click", function () {
    var done = function () { document.getElementById("toast").textContent = "Invite copied — tap Paste in the app."; setTimeout(function () { location.href = STORE_URL; }, 600); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(fullLink).then(done, function () { location.href = STORE_URL; });
    } else {
      var ta = document.createElement("textarea"); ta.value = fullLink; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta); done();
    }
  });
})();
</script>
</body>
</html>
